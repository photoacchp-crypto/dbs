<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .admin-shell { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .panel h3 { margin-top: 0; font-size: 1rem; }
    @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <span class="logo">Admin — <span id="admin-name"></span></span>
      <button class="btn btn-outline" id="btn-logout" style="color:#fff;border-color:rgba(255,255,255,0.3);margin-left:auto;">Keluar</button>
    </div>
  </header>
  <nav class="admin-nav" id="admin-nav"></nav>

  <div class="admin-shell">
    <h1>Dashboard</h1>
    <div class="stat-grid" id="stat-grid"></div>

    <div class="two-col">
      <div class="panel">
        <h3>Pesanan Terbaru</h3>
        <table class="admin-table" id="recent-orders-table">
          <thead><tr><th>Order</th><th>Pembeli</th><th>Total</th><th>Status</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="panel">
        <h3>Stok Menipis</h3>
        <table class="admin-table" id="low-stock-table">
          <thead><tr><th>Produk</th><th>SKU</th><th>Stok</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="panel" style="margin-top:20px;">
      <h3>Import Terbaru</h3>
      <table class="admin-table" id="recent-import-table">
        <thead><tr><th>File</th><th>Mode</th><th>Baris</th><th>Sukses</th><th>Gagal</th><th>Waktu</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/admin.js"></script>
  <script>
    AdminAuth.requireLogin();
    document.getElementById('admin-name').textContent = AdminAuth.username;
    renderAdminNav('dashboard');

    (async function loadDashboard() {
      const res = await Api.get('dashboardStats', { token: AdminAuth.token });
      if (!res.success) { alert('Gagal memuat dashboard: ' + res.message); return; }
      const d = res.data;

      document.getElementById('stat-grid').innerHTML = `
        <div class="stat-card"><div class="value">${d.totalProducts}</div><div class="label">Total Produk</div></div>
        <div class="stat-card"><div class="value">${d.activeProducts}</div><div class="label">Produk Aktif</div></div>
        <div class="stat-card"><div class="value">${d.outOfStockProducts}</div><div class="label">Produk Habis</div></div>
        <div class="stat-card"><div class="value">${d.totalCategories}</div><div class="label">Total Kategori</div></div>
        <div class="stat-card"><div class="value">${d.totalOrders}</div><div class="label">Total Order</div></div>
        <div class="stat-card"><div class="value">${d.pendingOrders}</div><div class="label">Order Pending</div></div>
        <div class="stat-card"><div class="value">${d.completedOrders}</div><div class="label">Order Selesai</div></div>
      `;

      document.querySelector('#recent-orders-table tbody').innerHTML = d.recentOrders.map(o => `
        <tr><td>${o.OrderNumber}</td><td>${escapeHtml(o.CustomerName)}</td><td>${formatCurrency(o.GrandTotal)}</td>
        <td><span class="status-pill ${o.Status.toLowerCase()}">${o.Status}</span></td></tr>
      `).join('') || '<tr><td colspan="4" class="text-muted">Belum ada order.</td></tr>';

      document.querySelector('#low-stock-table tbody').innerHTML = d.lowStock.map(p => `
        <tr><td>${p.ProductName}</td><td>${p.SKU}</td><td>${p.Stock}</td></tr>
      `).join('') || '<tr><td colspan="3" class="text-muted">Tidak ada stok menipis.</td></tr>';

      document.querySelector('#recent-import-table tbody').innerHTML = d.recentImports.map(i => `
        <tr><td>${escapeHtml(i.FileName)}</td><td>${i.ImportType}</td><td>${i.TotalRows}</td><td>${i.SuccessRows}</td><td>${i.FailedRows}</td><td>${new Date(i.StartedAt).toLocaleString('id-ID')}</td></tr>
      `).join('') || '<tr><td colspan="6" class="text-muted">Belum ada import.</td></tr>';
    })();
  </script>
</body>
</html>
