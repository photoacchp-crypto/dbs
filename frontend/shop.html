<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semua Produk — Toko Saya</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .shop-layout { display: grid; grid-template-columns: 220px 1fr; gap: 28px; padding: 32px 20px 80px; max-width: 1200px; margin: 0 auto; }
    .filters { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; align-self: start; position: sticky; top: calc(var(--header-height) + 16px); }
    .filters h4 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
    .filters select, .filters input[type="number"] { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 16px; }
    .filters label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; margin-bottom: 16px; }
    .price-range { display: flex; gap: 8px; margin-bottom: 8px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    #pagination { display: flex; gap: 6px; justify-content: center; margin-top: 28px; }
    @media (max-width: 900px) {
      .shop-layout { grid-template-columns: 1fr; }
      .filters { position: static; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" data-store-name>Toko Saya</a>
      <div class="search-bar">
        <input type="search" id="global-search" placeholder="Cari produk...">
      </div>
      <a href="cart.html" class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,0.3)">
        Keranjang <span data-cart-count style="margin-left:4px;">0</span>
      </a>
    </div>
  </header>

  <div class="shop-layout">
    <aside class="filters">
      <h4>Kategori</h4>
      <select id="filter-category"><option value="">Semua Kategori</option></select>

      <h4>Brand</h4>
      <select id="filter-brand"><option value="">Semua Brand</option></select>

      <h4>Rentang Harga</h4>
      <div class="price-range">
        <input type="number" id="min-price" placeholder="Min">
        <input type="number" id="max-price" placeholder="Max">
      </div>
      <button class="btn btn-outline" id="apply-price" style="width:100%;justify-content:center;margin-bottom:16px;">Terapkan</button>

      <label><input type="checkbox" id="promo-only"> Hanya produk promo</label>
    </aside>

    <main>
      <div class="toolbar">
        <h1 style="font-size:1.4rem;margin:0;">Semua Produk</h1>
        <select id="sort-select">
          <option value="newest">Terbaru</option>
          <option value="price_low">Harga terendah</option>
          <option value="price_high">Harga tertinggi</option>
          <option value="best_seller">Terlaris</option>
          <option value="name_az">Nama A-Z</option>
        </select>
      </div>

      <div class="product-grid" id="product-grid"></div>
      <div id="empty-state" hidden style="text-align:center;padding:60px 0;color:var(--muted);">
        <p>Produk tidak ditemukan.</p>
      </div>
      <div id="pagination"></div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p data-store-footer>&nbsp;</p>
      <p>&copy; <span id="year"></span> <span data-store-name>Toko Saya</span></p>
    </div>
  </footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/products.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    ShopPage.init();
  </script>
</body>
</html>
