<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Toko Saya</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--background);
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 36px; width: 320px; box-shadow: var(--shadow-md);
    }
    .login-card input {
      width: 100%; padding: 10px 12px; margin-bottom: 12px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem;
    }
    .login-error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <h2 style="margin-bottom:4px;">Admin</h2>
      <p class="text-muted" style="margin-top:0 0 16px;font-size:0.85rem;">Masuk untuk mengelola katalog & pesanan.</p>
      <input type="text" id="username" placeholder="Username" required autocomplete="username">
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Masuk</button>
    </form>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = '';

      const res = await Api.post('login', { username, password });
      if (res.success) {
        sessionStorage.setItem('admin_token', res.data.token);
        sessionStorage.setItem('admin_username', res.data.username);
        window.location.href = 'admin-dashboard.html'; // dibangun di Phase 6
      } else {
        errorEl.textContent = res.message || 'Login gagal';
      }
    });
  </script>
</body>
</html>
