<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang — Toko Saya</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .cart-layout { max-width: 900px; margin: 0 auto; padding: 32px 20px 100px; }
    .cart-item { display: grid; grid-template-columns: auto 70px 1fr auto auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: var(--radius-sm); background: var(--background); }
    .cart-item .name { font-weight: 600; font-size: 0.95rem; }
    .cart-item .variant { font-size: 0.8rem; color: var(--muted); }
    .qty-control { display: flex; align-items: center; gap: 6px; }
    .qty-control button { width: 28px; height: 28px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; cursor: pointer; }
    .qty-control input { width: 40px; text-align: center; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-data); }
    .remove-btn { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 0.85rem; }
    .cart-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .summary-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-top: 24px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
    .summary-row.total { font-weight: 700; font-size: 1.1rem; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
    .empty-cart { text-align: center; padding: 80px 0; color: var(--muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" data-store-name>Toko Saya</a>
      <a href="shop.html" class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,0.3);margin-left:auto;">Lanjut Belanja</a>
    </div>
  </header>

  <div class="cart-layout">
    <h1>Keranjang Belanja</h1>

    <div id="cart-empty" class="empty-cart" hidden>
      <p>Keranjang kamu masih kosong.</p>
      <a href="shop.html" class="btn btn-primary">Mulai Belanja</a>
    </div>

    <div id="cart-content" hidden>
      <div class="cart-toolbar">
        <label><input type="checkbox" id="select-all"> Pilih Semua</label>
        <button class="btn btn-outline" id="btn-clear">Kosongkan Keranjang</button>
      </div>

      <div id="cart-items"></div>

      <div class="summary-box">
        <div class="summary-row"><span>Subtotal</span><span class="price" id="sum-subtotal">Rp0</span></div>
        <div class="summary-row"><span>Diskon</span><span class="price" id="sum-discount">Rp0</span></div>
        <div class="summary-row total"><span>Total</span><span class="price" id="sum-total">Rp0</span></div>
        <button class="btn btn-primary" id="btn-checkout" style="width:100%;justify-content:center;margin-top:14px;">Lanjut ke Checkout</button>
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart-page.js"></script>
</body>
</html>
